<html><body>
<h1>{{.Event.Name}}</h1>
<p>Timestamp: {{.Event.Timestamp}}</p>
<ul>
{{range $k,$v := .Event.Fields}}
<li>{{$k}}: {{$v}}</li>
{{end}}
</ul>
<a href="/event?project={{.Project}}&name={{.Event.Name}}&index={{add .Index -1}}{{.FilterQ}}">Prev</a>
<a href="/event?project={{.Project}}&name={{.Event.Name}}&index={{add .Index 1}}{{.FilterQ}}">Next</a>
</body></html>
